[package]
name = "spicy_lang"
version = "0.1.0"
edition = "2024"

[dependencies]
spicy_errors = { path = "../spicy_errors" }
spicy_span = { path = "../spicy_span" }
codespan-reporting = { version = "0.13.1", default-features = false, features = ["std"] }
spicy_model = { path = "../spicy_model" }

[dev-dependencies]
insta = { version = "1.43.1", features = ["glob"] }

[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing`; see `src/lib.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
