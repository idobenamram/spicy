[package]
name = "spicy_bench"
version = "0.1.0"
edition = "2024"
publish = false

# The front end's benchmark suite: Valgrind instruction and allocation counts per stage,
# with gungraun. `src/` holds the input generators (and tests that each input still has
# the problems it's meant to have); `benches/` holds one file per stage.
#
#   cargo bench -p spicy_bench                            # every benchmark, ~20 s + build
#   cargo bench -p spicy_bench --bench resolve            # one stage
#   cargo bench -p spicy_bench -- --save-baseline=<name>  # record, then `--baseline=<name>`
#
# Needs valgrind and `gungraun-runner` 0.20.0 on PATH (or GUNGRAUN_RUNNER=<path>).

[lib]
# No libtest bench harness for the library: it would reject gungraun's options
# (`cargo bench -p spicy_bench -- --baseline=…`).
bench = false

[dependencies]
spicy_errors = { path = "../spicy_errors" }
spicy_lang = { path = "../spicy_lang" }
spicy_model = { path = "../spicy_model" }

[dev-dependencies]
# Pinned: the library and the `gungraun-runner` binary must be the same version.
gungraun = "=0.20.0"

[[bench]]
name = "lex_parse"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "flatten"
harness = false
