[package]
name = "spicy_simulate"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
ndarray = "0.16.1"
spicy_circuit = { path = "../spicy_circuit" }
thiserror = "2.0.16"
# Use system OpenBLAS to avoid building static OpenBLAS locally
ndarray-linalg = { version = "0.17", features = ["openblas-system"] }

[dev-dependencies]
spicy_parser = { path = "../spicy_parser" }
rstest = "0.23.0"
insta = "1.42.1"
criterion = { workspace = true }

[features]
# The KLU debugging binaries (src/bin). Off by default so the library doesn't
# pull in clap: `cargo run -p spicy_simulate --features klu-tools --bin klu_mtx`.
klu-tools = ["dep:clap"]

[[bin]]
name = "klu_mtx"
required-features = ["klu-tools"]

[[bin]]
name = "klu_solve_cmp"
required-features = ["klu-tools"]

[[bench]]
name = "klu_analyze"
path = "benches/klu_analyze.rs"
harness = false
