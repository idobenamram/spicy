name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system OpenBLAS (for ndarray-linalg openblas-system)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Install Rust (stable) with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cargo fmt --all --check

      - name: Run Clippy (warnings only)
        run: |
          cargo clippy --workspace --all-targets --all-features -- -W clippy::all

      - name: Run tests
        run: |
          cargo test --workspace --all-features --all-targets --no-fail-fast

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lychee 0.24.2
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          mkdir -p lychee && tar -xzf lychee-x86_64-unknown-linux-gnu.tar.gz -C lychee
          dirname "$(find "$RUNNER_TEMP/lychee" -name lychee -type f)" >> "$GITHUB_PATH"

      - name: Check the links in the docs and in code comments (settings in lychee.toml)
        run: scripts/check_links.sh


